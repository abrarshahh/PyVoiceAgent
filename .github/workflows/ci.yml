name: CI

on:
  push:
    branches: [ main, "v2/*" ]
  pull_request:
    branches: [ main, "v2/*" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Run unit tests
        run: |
          pytest -m unit

      - name: Build Wheel
        run: |
          pip install build
          python -m build
